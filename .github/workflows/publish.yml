name: Publish to PyPI

# Requires a PyPI "trusted publisher" configured for this repository and workflow:
# https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - run: uv run pytest

      - run: uv build

      - run: uv publish --trusted-publishing always
